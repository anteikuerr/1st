<html lang="ja">
<head>

<title>戦国合戦絵巻 — 勢力図で見る四大合戦</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="戦国合戦絵巻">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e141b">
<meta name="description" content="戦国時代の代表的な合戦を、勢力図と部隊の動きでビジュアルに追う">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
:root{
  --bg:#0e141b; --bg2:#121b24;
  --panel:#18222d; --panel2:#1e2b38;
  --line:#2a3a4a; --line2:#374c60;
  --text:#e9f0f7; --muted:#93a8bd; --dim:#6b8199;
  --gold:#d8ab5b; --gold-dim:#8a6d38;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.screen{display:none;flex-direction:column;height:100dvh}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#home.on{display:block}
.hero{
  padding:calc(var(--safe-t) + 30px) 20px 24px;
  background:radial-gradient(120% 80% at 50% 0%, #1c2a38 0%, transparent 70%), linear-gradient(180deg,#111a23,var(--bg));
  border-bottom:1px solid var(--line); text-align:center;
}
.hero .mark{font-size:26px;letter-spacing:.3em;margin-left:.3em;color:#9fb4c8}
.hero h1{
  margin:8px 0 6px; font-size:26px; letter-spacing:.16em; font-weight:700;
  background:linear-gradient(180deg,#f4e3c0,var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.06em;line-height:1.75}
.list{padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px}
.card{
  position:relative;display:block;width:100%;text-align:left;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line); border-radius:16px; padding:14px 15px 15px;
  overflow:hidden; transition:transform .12s ease, border-color .2s;
}
.card:active{transform:scale(.982);border-color:var(--line2)}
.card .yr{position:absolute;right:12px;top:8px;font-size:34px;font-weight:800;color:#ffffff0a;letter-spacing:-.02em;line-height:1}
.card h2{margin:0 0 3px;font-size:19px;letter-spacing:.06em}
.card .sub{margin:0 0 11px;font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.card .vs{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card .vs .nm{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .vs .nm.r{text-align:right}
.card .vs .x{font-size:10px;color:var(--dim);letter-spacing:.1em;flex:none}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#0a1017}
.bar i{display:block;height:100%}
.card .nums{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .tag{display:inline-block;margin-top:11px;font-size:10.5px;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--gold-dim);color:var(--gold)}
.credits{padding:8px 22px calc(var(--safe-b) + 30px);color:#4f6377;font-size:10.5px;line-height:1.8;text-align:center}

/* ---------- 詳細 ---------- */
.top{display:flex;align-items:center;gap:4px;flex:none;padding:calc(var(--safe-t) + 7px) 8px 7px;background:var(--bg2);border-bottom:1px solid var(--line)}
.top .back{padding:6px 8px;font-size:13.5px;color:var(--gold);letter-spacing:.04em;flex:none}
.top .ttl{flex:1;min-width:0;text-align:center}
.top .ttl b{display:block;font-size:15px;letter-spacing:.06em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.04em;margin-top:1px}
.top .rst{padding:6px 6px;font-size:10px;color:var(--muted);flex:none;text-align:right;line-height:1.35;max-width:76px}

.gauge{flex:none;padding:7px 12px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.gauge .lbls{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;margin-bottom:5px}
.gauge .g{display:flex;align-items:center;gap:5px;min-width:0}
.gauge .dot{width:8px;height:8px;border-radius:2px;flex:none}
.gauge .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gauge .tr{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.gauge .bar{height:9px;border-radius:5px}
.gauge .bar i{transition:flex-grow .55s cubic-bezier(.4,0,.2,1)}

.mapwrap{flex:1;min-height:0;position:relative;background:radial-gradient(130% 90% at 50% 25%, #17222e 0%, #0b1118 100%);touch-action:none;overflow:hidden}
svg.map{width:100%;height:100%;display:block}
.zoombtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:33px;height:33px;border-radius:9px;background:#0f1720cc;border:1px solid var(--line2);color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.zoombtns button:active{background:#1b2837}
.legend{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;background:#0f1720b3;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:10px;color:var(--muted);backdrop-filter:blur(6px);pointer-events:none;max-width:47%}
.legend div{display:flex;align-items:center;gap:6px}
.legend .sw{width:9px;height:9px;border-radius:99px;flex:none}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.info{flex:none;background:linear-gradient(180deg,var(--panel),var(--bg2));border-top:1px solid var(--line);padding:10px 14px 8px}
.info .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.info .num{font-size:9.5px;letter-spacing:.06em;color:#0e141b;background:var(--gold);border-radius:99px;padding:2px 8px;font-weight:700;flex:none}
.info h3{margin:0;font-size:15.5px;letter-spacing:.04em;font-weight:700;flex:1;min-width:0}
.info .tm{font-size:10.5px;color:var(--gold);letter-spacing:.03em;flex:none}
.info p{margin:0;font-size:13px;line-height:1.72;color:#cadaea;height:5.16em;overflow-y:auto;-webkit-overflow-scrolling:touch}
.info p b{color:#fff;font-weight:600}

.steps{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px calc(var(--safe-b) + 10px);background:var(--bg2);border-top:1px solid var(--line)}
.steps .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.steps .nav:disabled{opacity:.3}
.steps .nav:active:not(:disabled){background:var(--panel2)}
.dots{flex:1;display:flex;align-items:center;justify-content:space-between;position:relative;height:44px}
.dots::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--line);border-radius:2px}
.dots button{position:relative;width:28px;height:44px;display:flex;align-items:center;justify-content:center}
.dots i{display:block;width:11px;height:11px;border-radius:99px;background:var(--line2);border:2px solid var(--bg2);transition:all .25s}
.dots button.done i{background:var(--gold-dim)}
.dots button.cur i{background:var(--gold);width:16px;height:16px;box-shadow:0 0 0 4px #d8ab5b26}

/* SVG内 */
.u-lbl{font-size:25px;font-weight:700;paint-order:stroke;stroke:#0a1016;stroke-width:6px;stroke-linejoin:round}
.u-num{font-size:19px;fill:#adc0d2;paint-order:stroke;stroke:#0a1016;stroke-width:5px;stroke-linejoin:round}
.pl-lbl{font-size:20px;fill:#9db2c6;paint-order:stroke;stroke:#0a1016;stroke-width:5px;stroke-linejoin:round}
.geo-lbl{font-size:21px;fill:#5f7b93;letter-spacing:.14em;paint-order:stroke;stroke:#0a1016;stroke-width:5px;stroke-linejoin:round}
.ar-lbl{font-size:21px;font-weight:700;paint-order:stroke;stroke:#0a1016;stroke-width:5px;stroke-linejoin:round}
.unit{transition:transform .68s cubic-bezier(.45,.05,.25,1),opacity .4s}
.unit.gone{opacity:0}
.unit.fallen{opacity:.4}
.arrow{stroke-linecap:round;fill:none}
.arrow.dash{animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.ring{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;r:var(--r0)}50%{opacity:.18;r:var(--r1)}}
</style>
</head>

/* ===================== 小物 ===================== */
const $  = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (n,a={}) => { const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
const fmt = n => n.toLocaleString("ja-JP");
const radius = t => 10 + Math.sqrt(t)/6.5;

/* ===================== ホーム ===================== */
function buildHome(){
  const wrap = $("#cards");
  wrap.innerHTML = "";
  BATTLES.forEach(b=>{
    const [A,B] = b.sides;
    const sum = A.total + B.total;
    const c = document.createElement("button");
    c.className = "card";
    c.innerHTML = `
      <span class="yr">${b.year}</span>
      <h2>${b.name}</h2>
      <p class="sub">${b.date} ／ ${b.place}</p>
      <div class="vs">
        <span class="nm" style="color:${A.color}">${A.name}</span>
        <span class="x">VS</span>
        <span class="nm r" style="color:${B.color}">${B.name}</span>
      </div>
      <div class="bar">
        <i style="width:${A.total/sum*100}%;background:${A.color}"></i>
        <i style="width:${B.total/sum*100}%;background:${B.color}"></i>
      </div>
      <div class="nums"><span>${A.label}</span><span>${B.label}</span></div>
      <span class="tag">${b.tagline}</span>`;
    c.addEventListener("click", ()=>openBattle(b));
    wrap.appendChild(c);
  });
}

/* ===================== 状態 ===================== */
let cur = null, phase = 0;
const gfx = { units:{}, arrows:null, view:null };

function openBattle(b){
  cur = b; phase = 0;
  $("#bTitle").textContent  = b.name;
  $("#bMeta").textContent   = `${b.date}　${b.place}`;
  $("#bResult").textContent = b.short;

  const [A,B] = b.sides;
  $("#gd0").style.background = A.color; $("#gn0").textContent = A.name; $("#gt0").textContent = A.label;
  $("#gd1").style.background = B.color; $("#gn1").textContent = B.name; $("#gt1").textContent = B.label;
  $("#gb0").style.background = A.color; $("#gb1").style.background = B.color;

  $("#legend").innerHTML = b.sides.map(s=>
    `<div><span class="sw" style="background:${s.color}"></span><span>${s.name}</span></div>`).join("");

  buildDots(b);
  buildMap(b);
  resetView();
  setPhase(0, true);

  $("#home").classList.remove("on");
  $("#battle").classList.add("on");
}

function buildDots(b){
  const d = $("#dots"); d.innerHTML = "";
  b.phases.forEach((_,i)=>{
    const btn = document.createElement("button");
    btn.innerHTML = "<i></i>";
    btn.setAttribute("aria-label", `局面${i+1}`);
    btn.addEventListener("click", ()=>setPhase(i));
    d.appendChild(btn);
  });
}

/* ===================== 地図の構築 ===================== */
function buildMap(b){
  const svg = $("#map");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", b.vb);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  const defs = el("defs");
  const hg = el("radialGradient",{id:"hillG"});
  hg.appendChild(el("stop",{offset:"0%","stop-color":"#3b5064"}));
  hg.appendChild(el("stop",{offset:"100%","stop-color":"#22303d","stop-opacity":"0"}));
  defs.appendChild(hg);
  b.sides.forEach(s=>{
    const m = el("marker",{id:"mk-"+s.key, viewBox:"0 0 10 10", refX:"7.5", refY:"5",
      markerWidth:"4.4", markerHeight:"4.4", orient:"auto-start-reverse"});
    m.appendChild(el("path",{d:"M0,1 L9.5,5 L0,9 L2.2,5 Z", fill:s.color}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  const view = el("g"); svg.appendChild(view); gfx.view = view;
  const gTerrain=el("g"), gLbl=el("g"), gPlace=el("g"), gArrow=el("g"), gUnit=el("g");
  [gTerrain,gLbl,gPlace,gArrow,gUnit].forEach(g=>view.appendChild(g));
  gfx.arrows = gArrow;

  /* --- 地形 --- */
  (b.terrain||[]).forEach(f=>{
    if(f.t==="hill"){
      gTerrain.appendChild(el("ellipse",{cx:f.x,cy:f.y,rx:f.rx,ry:f.ry,fill:"url(#hillG)"}));
      gTerrain.appendChild(el("ellipse",{cx:f.x,cy:f.y,rx:f.rx,ry:f.ry,fill:"none",
        stroke:"#3d566c",'stroke-width':1.6,"stroke-dasharray":"7 8",opacity:.55}));
      gTerrain.appendChild(el("ellipse",{cx:f.x,cy:f.y,rx:f.rx*.56,ry:f.ry*.56,fill:"none",
        stroke:"#3d566c",'stroke-width':1.4,"stroke-dasharray":"6 9",opacity:.38}));
    }
    if(f.t==="water"){
      gTerrain.appendChild(el("path",{d:f.d,fill:"#123449",opacity:.92}));
      gTerrain.appendChild(el("path",{d:f.d,fill:"none",stroke:"#2f7ba6",'stroke-width':2,opacity:.5}));
    }
    if(f.t==="river"){
      gTerrain.appendChild(el("path",{d:f.d,fill:"none",stroke:"#16405a",
        'stroke-width':(f.w||12)+5,"stroke-linecap":"round"}));
      gTerrain.appendChild(el("path",{d:f.d,fill:"none",stroke:"#2b7099",
        'stroke-width':f.w||12,"stroke-linecap":"round",opacity:.92}));
    }
    if(f.t==="road"){
      gTerrain.appendChild(el("path",{d:f.d,fill:"none",stroke:"#4a5c6e",
        'stroke-width':4,"stroke-dasharray":"11 10","stroke-linecap":"round",opacity:.6}));
    }
    if(f.t==="fence"){
      gTerrain.appendChild(el("path",{d:f.d,fill:"none",stroke:"#8a6d38",
        'stroke-width':7,"stroke-dasharray":"4 9","stroke-linecap":"round"}));
    }
  });

  /* --- 地名 --- */
  (b.labels||[]).forEach(l=>{
    const t = el("text",{x:l.x,y:l.y,"text-anchor":"middle",class:"geo-lbl"});
    if(l.c) t.setAttribute("fill", l.c);
    t.textContent = l.t;
    gLbl.appendChild(t);
  });

  /* --- 城・砦・社寺 --- */
  (b.places||[]).forEach(p=>{
    const icon = {castle:"⌂", fort:"▣", shrine:"⛩", temple:"卍", ford:"≋"}[p.k] || "▣";
    const c = el("text",{x:p.x,y:p.y+9,"text-anchor":"middle","font-size":26,
      fill:p.k==="castle" ? "#cbb083" : "#8d9db0"});
    c.textContent = icon;
    gPlace.appendChild(c);
    const lo = p.lo||"bottom";
    const t = el("text",{class:"pl-lbl",
      x:p.x + (lo==="left"?-20: lo==="right"?20:0),
      y:p.y + (lo==="top"?-22: lo==="bottom"?38:7),
      "text-anchor": lo==="left"?"end": lo==="right"?"start":"middle"});
    t.textContent = p.n;
    gPlace.appendChild(t);
  });

  /* --- 方位記号 --- */
  if(b.compass){
    const {x,y,a} = b.compass;
    const g = el("g",{transform:`translate(${x},${y})`, opacity:.75});
    g.appendChild(el("circle",{r:30,fill:"#0d151d",opacity:.65,stroke:"#3d566c",'stroke-width':1.4}));
    const n = el("g",{transform:`rotate(${a})`});
    n.appendChild(el("path",{d:"M0,-22 L7,4 L0,-2 L-7,4 Z", fill:"#c9b184"}));
    n.appendChild(el("path",{d:"M0,22 L7,-4 L0,2 L-7,-4 Z", fill:"#4a6274"}));
    g.appendChild(n);
    const lx = 40*Math.sin(a*Math.PI/180), ly = -40*Math.cos(a*Math.PI/180);
    const t = el("text",{x:lx, y:ly+7, "text-anchor":"middle", "font-size":20,
      fill:"#c9b184", "font-weight":700});
    t.textContent = "北";
    g.appendChild(t);
    gLbl.appendChild(g);
  }

  /* --- 部隊 --- */
  gfx.units = {};
  b.units.forEach(u=>{
    const side = b.sides.find(s=>s.key===u.side);
    const r = radius(u.tr);
    const g = el("g",{class:"unit"});

    const ring = el("circle",{class:"ring",r:r+8,fill:"none",stroke:side.color,'stroke-width':3,opacity:0});
    ring.style.setProperty("--r0",(r+7)+"px");
    ring.style.setProperty("--r1",(r+20)+"px");
    g.appendChild(ring);

    g.appendChild(el("circle",{r:r+3,fill:"#0a1016",opacity:.9}));
    const body = el("circle",{r:r,fill:side.color,"fill-opacity":.33,stroke:side.color,'stroke-width':3.4});
    g.appendChild(body);
    const cross = el("path",{
      d:`M${-r*.58},${-r*.58} L${r*.58},${r*.58} M${r*.58},${-r*.58} L${-r*.58},${r*.58}`,
      stroke:"#ccd8e4",'stroke-width':3.4,"stroke-linecap":"round",opacity:0});
    g.appendChild(cross);

    const lo = u.lo || "top";
    const dx = lo==="left" ? -(r+11) : lo==="right" ? (r+11) : 0;
    const dy = lo==="top"  ? -(r+20) : lo==="bottom" ? (r+40) : -4;
    const anc = lo==="left" ? "end" : lo==="right" ? "start" : "middle";

    const name = el("text",{class:"u-lbl",x:dx,y:dy,"text-anchor":anc,fill:side.color});
    name.textContent = u.n;
    g.appendChild(name);
    const num = el("text",{class:"u-num",x:dx,y:dy+22,"text-anchor":anc});
    num.textContent = fmt(u.tr);
    g.appendChild(num);

    gUnit.appendChild(g);
    gfx.units[u.id] = {g, ring, body, cross, name, side, r};
  });
}

/* ===================== 局面の反映 ===================== */
function posAt(u,p){
  for(let i=p;i>=0;i--) if(u.pos[i]) return u.pos[i];
  const ks = Object.keys(u.pos).map(Number).sort((a,b)=>a-b);
  return u.pos[ks[0]];
}

function setPhase(i, instant){
  if(!cur) return;
  phase = Math.max(0, Math.min(cur.phases.length-1, i));
  const ph = cur.phases[phase];

  $("#pNum").textContent   = `局面 ${phase+1}／${cur.phases.length}`;
  $("#pTitle").textContent = ph.t;
  $("#pTime").textContent  = ph.tm || "";
  $("#pText").innerHTML    = ph.x;
  $("#pText").scrollTop    = 0;

  [...$("#dots").children].forEach((b,n)=>{
    b.className = n===phase ? "cur" : (n<phase ? "done" : "");
  });
  $("#prev").disabled = phase===0;
  $("#next").disabled = phase===cur.phases.length-1;

  const adv = ph.adv ?? .5;
  $("#gb0").style.flex = `${1-adv} 0 0`;
  $("#gb1").style.flex = `${adv} 0 0`;

  cur.units.forEach(u=>{
    const G = gfx.units[u.id];
    const [x,y] = posAt(u, phase);
    if(instant) G.g.style.transition = "none";
    G.g.setAttribute("transform", `translate(${x},${y})`);
    if(instant) requestAnimationFrame(()=>{ G.g.style.transition = ""; });

    const hidden = phase < (u.born ?? 0) || (u.exit != null && phase >= u.exit);
    const fallen = u.dead != null && phase >= u.dead;
    G.g.classList.toggle("gone", hidden);
    G.g.classList.toggle("fallen", fallen && !hidden);
    G.cross.setAttribute("opacity", fallen ? .9 : 0);

    let side = G.side;
    if(u.flip != null && phase >= u.flip){
      side = cur.sides.find(s=>s.key !== u.side);
      G.body.setAttribute("stroke-dasharray","8 5");
    } else {
      G.body.removeAttribute("stroke-dasharray");
    }
    G.body.setAttribute("fill", side.color);
    G.body.setAttribute("stroke", side.color);
    G.name.setAttribute("fill", side.color);
    G.ring.setAttribute("stroke", side.color);

    G.ring.setAttribute("opacity", (!hidden && !fallen && (ph.focus||[]).includes(u.id)) ? 1 : 0);
  });

  /* 矢印 */
  gfx.arrows.innerHTML = "";
  (ph.arrows||[]).forEach(a=>{
    const side = cur.sides.find(s=>s.key===a.s) || cur.sides[0];
    const [x1,y1] = a.f, [x2,y2] = a.t;
    const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
    const len = Math.hypot(dx,dy) || 1;
    const bow = Math.min(len*0.17, 60);
    const cx = mx - dy/len*bow, cy = my + dx/len*bow;
    const d = `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
    const w = a.big ? 10 : 6.5;

    gfx.arrows.appendChild(el("path",{d, class:"arrow", stroke:"#0a1016",
      'stroke-width':w+6, opacity:.6, "stroke-linecap":"round"}));

    const p = el("path",{d, class:"arrow"+(a.dash?" dash":""), stroke:side.color,
      'stroke-width':w, "marker-end":`url(#mk-${side.key})`});
    if(a.dash) p.setAttribute("stroke-dasharray","18 12");
    if(a.dot){ p.setAttribute("stroke-dasharray","4 12"); p.setAttribute("opacity",".7"); }
    gfx.arrows.appendChild(p);

    if(a.lb){
      const o = a.lbo || [0,0];
      const t = el("text",{x:cx+o[0], y:cy-14+o[1], "text-anchor":"middle", class:"ar-lbl", fill:side.color});
      t.textContent = a.lb;
      gfx.arrows.appendChild(t);
    }
  });
}

/* ===================== ズーム・パン ===================== */
const V = {s:1, x:0, y:0};
function applyView(){
  if(gfx.view) gfx.view.setAttribute("transform", `translate(${V.x},${V.y}) scale(${V.s})`);
}
function resetView(){ V.s=1; V.x=0; V.y=0; applyView(); }
function zoomAt(f, px, py){
  const ns = Math.max(.8, Math.min(4, V.s*f));
  const k = ns/V.s;
  V.x = px - (px - V.x)*k;
  V.y = py - (py - V.y)*k;
  V.s = ns; applyView();
}
function svgPt(cx, cy){
  const svg = $("#map"), r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  if(!vb.width) return [0,0];
  const sc = Math.min(r.width/vb.width, r.height/vb.height);
  return [ (cx - r.left - (r.width - vb.width*sc)/2)/sc,
           (cy - r.top  - (r.height- vb.height*sc)/2)/sc ];
}

(function gestures(){
  const wrap = $("#mapwrap");
  let mode = 0, last = null, lastDist = 0;

  wrap.addEventListener("touchstart", e=>{
    if(e.touches.length===1){ mode=1; last = svgPt(e.touches[0].clientX, e.touches[0].clientY); }
    else if(e.touches.length>=2){
      mode=2;
      const [a,b] = e.touches;
      lastDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      last = svgPt((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);
    }
  }, {passive:true});

  wrap.addEventListener("touchmove", e=>{
    if(mode===1 && e.touches.length===1){
      const p = svgPt(e.touches[0].clientX, e.touches[0].clientY);
      V.x += p[0]-last[0]; V.y += p[1]-last[1]; last = p;
      applyView(); e.preventDefault();
    } else if(mode===2 && e.touches.length>=2){
      const [a,b] = e.touches;
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      const mid  = svgPt((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);
      if(lastDist>0) zoomAt(dist/lastDist, mid[0], mid[1]);
      V.x += mid[0]-last[0]; V.y += mid[1]-last[1];
      lastDist = dist; last = mid;
      applyView(); e.preventDefault();
    }
  }, {passive:false});

  wrap.addEventListener("touchend", e=>{ if(e.touches.length===0) mode=0; }, {passive:true});

  let drag=false, ml=null;
  wrap.addEventListener("mousedown", e=>{ drag=true; ml=svgPt(e.clientX,e.clientY); });
  window.addEventListener("mousemove", e=>{
    if(!drag) return;
    const p = svgPt(e.clientX, e.clientY);
    V.x += p[0]-ml[0]; V.y += p[1]-ml[1]; ml = p; applyView();
  });
  window.addEventListener("mouseup", ()=>drag=false);
  wrap.addEventListener("wheel", e=>{
    const p = svgPt(e.clientX, e.clientY);
    zoomAt(e.deltaY<0?1.12:1/1.12, p[0], p[1]);
    e.preventDefault();
  }, {passive:false});
})();

/* ===================== 操作 ===================== */
$("#prev").addEventListener("click", ()=>setPhase(phase-1));
$("#next").addEventListener("click", ()=>setPhase(phase+1));
$("#zin").addEventListener("click",  ()=>zoomAt(1.3, 400, 580));
$("#zout").addEventListener("click", ()=>zoomAt(1/1.3, 400, 580));
$("#zrst").addEventListener("click", resetView);
$("#back").addEventListener("click", ()=>{
  $("#battle").classList.remove("on");
  $("#home").classList.add("on");
});
window.addEventListener("keydown", e=>{
  if(!$("#battle").classList.contains("on")) return;
  if(e.key==="ArrowRight") setPhase(phase+1);
  if(e.key==="ArrowLeft")  setPhase(phase-1);
  if(e.key==="Escape") $("#back").click();
});

buildHome();
</script>
</body>
