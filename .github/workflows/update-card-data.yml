# アプリ同梱のカードデータ (carddata.json) を自動更新する
name: カードデータ更新

on:
  workflow_dispatch: {} # 手動実行 (Actionsタブの Run workflow ボタン)
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00 JST頃 (新パックがデータ元に載り次第、自動反映)

permissions:
  contents: write

jobs:
  update-card-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: カードデータ取得
        run: python3 download_cards.py --meta-only

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carddata.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "カードデータ自動更新"
            git push
          fi
